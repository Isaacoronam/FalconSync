name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Pruebas, build y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:9.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            falcon-sync-backend/package-lock.json
            falcon-sync-frontend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: falcon-sync-backend
        run: npm ci

      - name: Pruebas del backend
        working-directory: falcon-sync-backend
        run: npm test

      - name: Instalar dependencias del frontend
        working-directory: falcon-sync-frontend
        run: npm ci

      - name: Pruebas del frontend
        working-directory: falcon-sync-frontend
        run: npm test -- --watch=false

      - name: Build de producción
        working-directory: falcon-sync-frontend
        run: npm run build

      - name: Instalar Chromium de Playwright
        working-directory: falcon-sync-frontend
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        working-directory: falcon-sync-frontend
        run: npm run e2e

      - name: Publicar reporte E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            falcon-sync-frontend/playwright-report
            falcon-sync-frontend/test-results
          retention-days: 7
