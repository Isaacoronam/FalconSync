name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright usa Chromium y reintentos cuando CI está definido.
  CI: 'true'
  E2E_MONGODB_URI: mongodb://127.0.0.1:27018/falconsync_e2e?replicaSet=falconsyncTest

jobs:
  verify:
    name: Pruebas, build y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            projects/backend/package-lock.json
            projects/frontend/package-lock.json

      # Conservation, evidence and E2E use transactions, so MongoDB must run as a
      # replica set. The same mongod is published on both ports used by the suites
      # (27017 for most backend tests, 27018 for conservation, evidence and E2E).
      # Each test file keeps its own database name; do not set MONGODB_URI_TEST
      # globally or every suite would share one database.
      - name: Iniciar MongoDB con replica set
        run: |
          docker run --detach --name falconsync-mongo \
            --publish 27017:27017 \
            --publish 27018:27017 \
            mongo:9.0 --replSet falconsyncTest --bind_ip_all

          for attempt in $(seq 1 30); do
            if docker exec falconsync-mongo mongosh --quiet \
              --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec falconsync-mongo mongosh --quiet --eval \
            'rs.initiate({ _id: "falconsyncTest", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'

          for attempt in $(seq 1 30); do
            primary=$(docker exec falconsync-mongo mongosh --quiet \
              --eval 'db.hello().isWritablePrimary')
            if [ "$primary" = "true" ]; then
              echo "MongoDB replica set falconsyncTest es PRIMARY en :27017 y :27018"
              exit 0
            fi
            sleep 1
          done

          echo "MongoDB no alcanzó el estado PRIMARY" >&2
          docker logs falconsync-mongo
          exit 1

      - name: Instalar dependencias del backend
        working-directory: projects/backend
        run: npm ci

      - name: Auditoría de dependencias del backend
        working-directory: projects/backend
        run: npm audit --omit=dev

      - name: Pruebas del backend
        working-directory: projects/backend
        run: npm test

      - name: Instalar dependencias del frontend
        working-directory: projects/frontend
        run: npm ci

      - name: Auditoría de dependencias del frontend
        working-directory: projects/frontend
        run: npm audit --omit=dev

      - name: Pruebas del frontend
        working-directory: projects/frontend
        run: npm test -- --watch=false

      - name: Build de producción
        working-directory: projects/frontend
        run: npm run build

      - name: Instalar Chromium de Playwright
        working-directory: projects/frontend
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        working-directory: projects/frontend
        run: npm run e2e

      - name: Publicar reporte E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            projects/frontend/playwright-report
            projects/frontend/test-results
          retention-days: 7

      - name: Detener MongoDB
        if: always()
        run: docker rm --force falconsync-mongo || true
