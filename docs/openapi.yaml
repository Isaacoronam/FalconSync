                  data:
                    $ref: '#/components/schemas/Intervention'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /evidence:
    post:
      tags: [Evidence]
      summary: Subir evidencia privada
      description: |
        Carga multipart. Requiere `evidence.upload`. El archivo se valida por firma binaria,
        se decodifica, se le extraen fecha/GPS, se elimina EXIF y se calcula SHA-256. El
        `purpose` es obligatorio. La respuesta es `202`; el estado de análisis es
        `available` cuando la configuración local permite evidencia sin escanear, o
        `pending_scan` cuando se habilita el análisis. En producción, sin motor antimalware,
        responde `503 EVIDENCE_SCAN_UNAVAILABLE`. `Idempotency-Key` es opcional: un reintento
        con la misma clave, archivo y propietario devuelve la evidencia existente.
      operationId: uploadEvidence
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvidenceUpload'
      responses:
        '202':
          description: Evidencia aceptada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Evidence]
      summary: Listar evidencia autorizada de un propietario
      description: |
        Requiere `evidence.read.assigned` y autorización por recurso sobre `ownerType` y
        `ownerId`. Si se indica `findingId`, solo devuelve la evidencia de ese hallazgo.
        `storageKey` e `idempotencyKey` nunca se exponen.
      operationId: listEvidence
      x-falconsync-status: implemented
      parameters:
        - name: ownerType
          in: query
          required: true
          schema:
            type: string
            enum: [Report, Inspection, Intervention]
        - name: ownerId
          in: query
          required: true
          schema:
            type: string
        - name: findingId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Evidencia autorizada, paginada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /evidence/{id}:
    get:
      tags: [Evidence]
      summary: Descargar evidencia autorizada
      description: |
        Autoriza por `ownerType` + `ownerId`, verifica el hash y registra el acceso antes de
        transmitir. Nunca se sirve desde `/api/uploads`. El binario no se cachea. `purpose`
        es obligatorio y se registra en `EvidenceAccessLog`. El rol de auditoría solo puede
        consultar metadatos y accesos, no descargar.
      operationId: downloadEvidence
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
        - name: purpose
          in: query
          required: true
          description: Motivo del acceso; se registra en `EvidenceAccessLog`.
          schema:
            type: string
            minLength: 3
            maxLength: 300
      responses:
        '200':
          description: Binario privado.
          headers:
            Cache-Control:
              description: Siempre `private, no-store`.
              schema:
                type: string
                example: private, no-store
            Content-Disposition:
              description: Nombre seguro para descarga.
              schema:
                type: string
            X-Content-Type-Options:
              description: Siempre `nosniff`.
              schema:
                type: string
                example: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
