              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminPanorama'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /admin/panoramas/{id}/publish:
    post:
      tags: [Admin]
      summary: Publicar un panorama aprobado
      description: |
        Requiere `If-Match`. En un panorama público exige `panorama.publish`; en uno de
        inspección, `panorama.manage`. Solo se publica desde `approved`, con derechos,
        fallback completo y destino publicado; si falta algo responde
        `409 PANORAMA_NOT_READY`.
      operationId: publishPanorama
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/PanoramaId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Panorama publicado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminPanorama'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /admin/panoramas/{id}/archive:
    post:
      tags: [Admin]
      summary: Archivar un panorama
      description: |
        Requiere `If-Match`. En un panorama público exige `panorama.publish`; en uno de
        inspección, `panorama.manage`. Un panorama archivado deja de servirse y no se edita.
      operationId: archivePanorama
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/PanoramaId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Panorama archivado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminPanorama'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /admin/sources:
    get:
      tags: [Admin]
      summary: Listar el registro de fuentes RAG
      operationId: listSources
      x-falconsync-status: planned
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, active, superseded, retracted]
        - name: accessLevel
          in: query
          required: false
          schema:
            type: string
            enum: [public, internal, restricted]
      responses:
        '200':
          description: Fuentes registradas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSource'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users:
    get:
      tags: [Admin]
      summary: Listar cuentas
      description: |
        Solo para `admin`. Filtra por texto (`q` en nombre, correo o usuario), rol y estado.
        Devuelve `totalPages` en `meta`, no `hasMore`.
      operationId: listAdminUsers
      x-falconsync-status: implemented
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [user, moderator, historian, inspector, admin]
        - name: active
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cuentas paginadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/evidence/{id}/access-log:
    get:
      tags: [Admin]
      summary: Consultar el registro de acceso a una evidencia
      description: |
        Solo para `admin` con `audit.read`. Devuelve metadatos de acceso, no el binario ni
        una URL de descarga. El registro es append-only.
      operationId: listEvidenceAccessLog
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Accesos registrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceAccessLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{id}/role:
    patch:
      tags: [Admin]
      summary: Cambiar el rol de una cuenta
      description: |
        Solo para `admin`. Exige `currentPassword`, revoca sesiones, incrementa
        `tokenVersion` y registra auditoría obligatoria. Protege al último admin activo y la
        propia cuenta. Los roles asignables son `user`, `historian`, `inspector` y `admin`.
      operationId: updateUserRole
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequest'
      responses:
        '200':
          description: Rol actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMutationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/users/{id}/status:
    patch:
      tags: [Admin]
      summary: Activar o desactivar una cuenta
      description: |
        Solo para `admin`. Exige `currentPassword`, revoca sesiones y audita. Protege al
        último admin activo y la propia cuenta.
      operationId: updateUserStatus
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdateRequest'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMutationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/users/{id}/revoke-sessions:
    post:
      tags: [Admin]
      summary: Revocar las sesiones de una cuenta
      description: Solo para `admin`. Exige `currentPassword` y auditoría obligatoria.
      operationId: revokeUserSessions
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionsRequest'
      responses:
        '200':
          description: Sesiones revocadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Clave única por actor para reintentos seguros de `POST /evidence`. Opcional; si se
        reutiliza con otro archivo u otro propietario, responde `409 IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        minLength: 8
        maxLength: 120
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la versión actual, por ejemplo `"3"`.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Último cursor confirmado (`v1:<epochMillis>:<eventId>`).
      schema:
        type: string
        maxLength: 120
    ReportQueueState:
      name: state
      in: query
      required: false
      description: Si se omite o no es válido, se devuelven los tres estados de la cola.
      schema:
        type: string
        enum: [received, triaged, accepted]
    InspectionState:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [planned, in_progress, submitted, returned, reviewed, closed, cancelled]
    HeritageAssetId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: string
    InspectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InterventionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    EvidenceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
    PanoramaId:
      name: id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
  headers:
    ETag:
      description: >-
        Identificador de la representación. En las transiciones críticas, `If-Match`
        usa la versión numérica del recurso. En `GET /inspections/{id}` se calcula
        sobre el cuerpo completo porque incluye intervenciones y su evidencia, que
        cambian sin incrementar la versión de la inspección.
      schema:
        type: string
        example: '"3"'
  responses:
    ValidationError:
      description: Datos inválidos o faltantes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos
                  details:
                    - La descripción es obligatoria
    Unauthorized:
      description: Sesión ausente, inválida o revocada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            authentication:
              value:
                error:
                  code: AUTHENTICATION_REQUIRED
                  message: Debes iniciar sesión para continuar
            revoked:
              value:
                error:
                  code: SESSION_REVOKED
                  message: La sesión fue revocada. Inicia sesión de nuevo
    Forbidden:
      description: Capacidad insuficiente o recurso no autorizado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: No tienes permisos para realizar esta acción
            selfReview:
              value:
                error:
                  code: SELF_REVIEW_FORBIDDEN
                  message: No puedes revisar tu propia inspección
    NotFound:
      description: Recurso inexistente o no visible para el actor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: Recurso no encontrado
    Conflict:
      description: Conflicto de estado, versión, idempotencia o regla de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidTransition:
              value:
                error:
                  code: INVALID_TRANSITION
                  message: La transición solicitada no es válida
            versionConflict:
              value:
                error:
                  code: VERSION_CONFLICT
                  message: El recurso cambió; recarga e intenta de nuevo
            idempotencyConflict:
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: La clave de idempotencia se usó con otra evidencia
            reportNotAccepted:
              value:
                error:
                  code: REPORT_NOT_ACCEPTED
                  message: Solo se convierte un reporte aceptado
            closure:
              value:
                error:
                  code: CLOSURE_REQUIRES_VERIFIED_INTERVENTION
                  message: Hay hallazgos que requieren una intervención verificada
    PreconditionRequired:
      description: Falta `If-Match` en una transición crítica.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            precondition:
              value:
                error:
                  code: VERSION_REQUIRED
                  message: Debes enviar la versión actual en la cabecera If-Match
    PayloadTooLarge:
      description: El archivo supera el límite permitido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tooLarge:
              value:
                error:
                  code: EVIDENCE_TOO_LARGE
                  message: La evidencia supera el tamaño máximo permitido
    UnsupportedMediaType:
      description: Firma o MIME no permitido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            media:
              value:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: El archivo debe ser JPEG, PNG, WebP o PDF válido
    TooManyRequests:
      description: Límite de frecuencia o cuota.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate:
              value:
                error:
                  code: RATE_LIMITED
                  message: Demasiadas solicitudes; espera antes de reintentar
    ServiceUnavailable:
      description: Dependencia no disponible o control de seguridad no desplegado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            scan:
              value:
                error:
                  code: EVIDENCE_SCAN_UNAVAILABLE
                  message: La subida de evidencia está desactivada hasta habilitar el análisis antimalware
            transactions:
              value:
                error:
                  code: TRANSACTIONS_REQUIRED
                  message: La conservación requiere MongoDB configurado como replica set
            audit:
              value:
                error:
                  code: AUDIT_REQUIRED
                  message: No se pudo registrar la auditoría; el cambio fue revertido
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties: true
    PageMeta:
      type: object
      required: [page, limit, total, hasMore]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    AdminUserPageMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    AdminUser:
      type: object
      required: [id, name, username, email, role, isActive, createdAt, lastLoginAt]
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, moderator, historian, inspector, admin]
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    AdminUserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        meta:
          $ref: '#/components/schemas/AdminUserPageMeta'
    InspectorOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    GeoPoint:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          description: '[longitud, latitud]'
    Polygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
    Geometry:
      oneOf:
        - $ref: '#/components/schemas/GeoPoint'
        - $ref: '#/components/schemas/Polygon'
    HeritageAssetSummary:
      type: object
      required: [id, code, name, type, unescoStatus, status]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [building, monument, urban_space, archaeological_site, museum, natural_site, other]
        unescoStatus:
          type: string
          enum: [inscribed, buffer_zone, not_listed, unknown]
        protectionLevel:
          type: string
          enum: [national, state, municipal, none, unknown]
        status:
          type: string
          enum: [draft, active, archived]
        locationId:
          type: string
          nullable: true
    HeritageAsset:
      allOf:
        - $ref: '#/components/schemas/HeritageAssetSummary'
        - type: object
          properties:
            address:
              type: string
            geometry:
              $ref: '#/components/schemas/Geometry'
            description:
              type: string
            sourceRefs:
              type: array
              items:
                type: string
            createdBy:
              type: string
            updatedBy:
              type: string
              nullable: true
            archivedAt:
              type: string
              format: date-time
              nullable: true
            deletedAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    HeritageAssetCreate:
      type: object
      required: [code, name, type]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{2,39}$'
        name:
          type: string
          minLength: 2
          maxLength: 160
        type:
          type: string
          enum: [building, monument, urban_space, archaeological_site, museum, natural_site, other]
        locationId:
          type: string
          nullable: true
        unescoStatus:
          type: string
          enum: [inscribed, buffer_zone, not_listed, unknown]
          default: unknown
        protectionLevel:
          type: string
          enum: [national, state, municipal, none, unknown]
          default: unknown
        address:
          type: string
          maxLength: 240
        geometry:
          $ref: '#/components/schemas/Geometry'
        description:
          type: string
          maxLength: 5000
        sourceRefs:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 500
        notes:
          type: string
          maxLength: 4000
        status:
          type: string
          enum: [draft, active, archived]
          default: draft
    HeritageAssetUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        type:
          type: string
          enum: [building, monument, urban_space, archaeological_site, museum, natural_site, other]
        locationId:
          type: string
          nullable: true
        unescoStatus:
          type: string
          enum: [inscribed, buffer_zone, not_listed, unknown]
        protectionLevel:
          type: string
          enum: [national, state, municipal, none, unknown]
        address:
          type: string
          maxLength: 240
        geometry:
          $ref: '#/components/schemas/Geometry'
        description:
          type: string
          maxLength: 5000
        sourceRefs:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 500
        notes:
          type: string
          maxLength: 4000
        status:
          type: string
          enum: [draft, active, archived]
    ReportSummary:
      type: object
      required: [id, category, state, capturedAt, version]
      properties:
        id:
          type: string
        category:
          type: string
          enum: [structural, moisture, cracks, material_loss, vandalism, vegetation, fire, collapse_risk, other]
        description:
          type: string
          description: Puede omitirse en la vista de auditoría.
        state:
          type: string
          enum: [received, triaged, accepted, rejected, converted, closed]
        capturedAt:
          type: string
          format: date-time
        heritageAssetId:
          type: string
          nullable: true
        locationId:
          type: string
          nullable: true
        inspectionId:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Report:
      allOf:
        - $ref: '#/components/schemas/ReportSummary'
        - type: object
          properties:
            reporterId:
              type: string
              description: Puede omitirse en la vista de auditoría.
            gps:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/GeoPoint'
            accuracyMeters:
              type: number
              nullable: true
            triage:
              type: object
              nullable: true
              properties:
                decision:
                  type: string
                  enum: [accept, reject, close]
                  nullable: true
                triagedBy:
                  type: string
                  nullable: true
                triagedAt:
                  type: string
                  format: date-time
                  nullable: true
                notes:
                  type: string
                  description: No se expone en las vistas públicas.
            rejectionReason:
              type: string
              nullable: true
            evidenceIds:
              type: array
              items:
                type: string
    ReportCreate:
      type: object
      required: [category, description]
      anyOf:
