openapi: 3.0.3
info:
  title: FALCONSYNC — API de conservación y evidencia
  version: 0.2.0
  description: |
    Contrato de las rutas implementadas del dominio de conservación, evidencia privada,
    administración de cuentas, tiempo real, asistentes y visita 360°.

    **Estado:** las operaciones marcadas con `x-falconsync-status: implemented` existen en el
    código actual y se describen con sus rutas, cuerpos y envolturas reales. Las marcadas con
    `x-falconsync-status: planned` son rutas futuras y no deben consumirse todavía.

    Las rutas vigentes de autenticación, POI, perfil, check-in y administración de POI no se
    repiten aquí; su contrato está en `docs/AUTENTICACION.md`, `docs/POI.md`, `docs/PERFIL.md`
    y `docs/ADMINISTRACION.md`. El sobre de error es el mismo en toda la API:
    `{ "error": { "code", "message", "details?" } }`.

    Las transiciones críticas exigen `If-Match: "<version>"`. Solo `POST /evidence` admite
    `Idempotency-Key`; los reportes e inspecciones no lo interpretan. Las listas paginadas
    usan `{ "data": [...], "meta": { "page", "limit", "total", "hasMore" } }`; la lista de
    cuentas usa `totalPages` en lugar de `hasMore`.

    La evidencia privada se sirve únicamente por `GET /evidence/{id}` con autorización por
    recurso y registro de acceso. En producción, mientras no exista un motor antimalware
    desplegado, `POST /evidence` responde `503 EVIDENCE_SCAN_UNAVAILABLE`.
  contact:
    name: FALCONSYNC
    url: https://github.com/Isaacoronam/FalconSync
  license:
    name: Uso académico y prototipado
    url: https://github.com/Isaacoronam/FalconSync
servers:
  - url: http://localhost:3000/api
    description: Desarrollo local
  - url: https://api.example.invalid/api
    description: Marcador de staging/producción; no es un entorno real
tags:
  - name: Assets
    description: Activos patrimoniales inspeccionables y su enlace con POI.
  - name: Reports
    description: Avisos ciudadanos autenticados y triaje.
  - name: Inspections
    description: Inspecciones, hallazgos, revisión y cierre.
  - name: Interventions
    description: Intervenciones de conservación y verificación.
  - name: Evidence
    description: Evidencia privada con hash y acceso auditado.
  - name: Notifications
    description: Notificaciones persistidas y cursor.
  - name: Realtime
    description: Ticket de corta duración para Socket.IO.
  - name: Assistant
    description: Guía turística y asistente técnico con citas.
  - name: Panoramas
    description: Visita 360° pública.
  - name: Admin
    description: Administración de cuentas, accesos a evidencia y fuentes.
security:
  - bearerAuth: []
paths:
  /heritage-assets:
    get:
      tags: [Assets]
      summary: Listar activos patrimoniales activos
      description: |
        Ruta pública. Devuelve los activos con `status=active` y `deletedAt=null`, ordenados
        por nombre y limitados a 200. No expone `notes` ni deduce `unescoStatus` a partir del
        POI. No admite filtros ni paginación en la implementación actual.
      operationId: listHeritageAssets
      x-falconsync-status: implemented
      security: []
      responses:
        '200':
          description: Lista de activos activos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HeritageAssetSummary'
    post:
      tags: [Assets]
      summary: Crear un activo patrimonial
      description: |
        Requiere `asset.manage`. El código es único y no se reutiliza tras archivar.
        `unescoStatus` se registra con fuente; no se deduce del nombre ni del POI.
      operationId: createHeritageAsset
      x-falconsync-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeritageAssetCreate'
      responses:
        '201':
          description: Activo creado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HeritageAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /heritage-assets/{id}:
    get:
      tags: [Assets]
      summary: Consultar un activo patrimonial
      operationId: getHeritageAsset
      x-falconsync-status: planned
      parameters:
        - $ref: '#/components/parameters/HeritageAssetId'
      responses:
        '200':
          description: Detalle del activo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HeritageAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Assets]
      summary: Actualizar un activo patrimonial
      description: |
        Requiere `asset.manage`. El `code` no se modifica. Cambiar el estado a `archived`
        impide nuevas inspecciones. No altera hallazgos, inspecciones ni la proyección pública.
      operationId: updateHeritageAsset
      x-falconsync-status: planned
      parameters:
        - $ref: '#/components/parameters/HeritageAssetId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeritageAssetUpdate'
      responses:
        '200':
          description: Activo actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HeritageAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /reports:
    post:
      tags: [Reports]
      summary: Crear un reporte autenticado
      description: |
        Crea un reporte en estado `received`. Requiere `report.create` y al menos uno de
        `heritageAssetId` o `locationId`. La evidencia se sube después con `POST /evidence`
        y `ownerType=Report`; el reporte puede existir sin evidencia. No admite
        `Idempotency-Key`.
      operationId: createReport
      x-falconsync-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Reporte creado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /reports/mine:
    get:
      tags: [Reports]
      summary: Listar los reportes propios
      description: |
        Requiere `report.read.own`. Devuelve solo reportes cuyo `reporterId` es el actor
        autenticado, ordenados del más reciente al más antiguo. El filtro `state` no está
        implementado en esta ruta.
      operationId: listMyReports
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reports/queue:
    get:
      tags: [Reports]
      summary: Listar reportes para triaje
      description: |
        Requiere `report.triage` o `report.read.all`. Devuelve reportes en `received`,
        `triaged` o `accepted`, ordenados del más antiguo al más nuevo. Si `state` no es uno
        de esos valores, se devuelven los tres estados.
      operationId: listReportsForTriage
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ReportQueueState'
      responses:
        '200':
          description: Cola de triaje paginada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reports/{id}:
    get:
      tags: [Reports]
      summary: Consultar un reporte
      description: |
        El dueño usa `report.read.own`; un inspector con `report.read.all` puede consultarlo
        para triaje. Un admin con `audit.read` recibe solo metadatos y eventos de auditoría,
        sin descripción ni notas de triaje.
      operationId: getReport
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Reporte con evidencia referenciada por ID.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{id}/triage:
    patch:
      tags: [Reports]
      summary: Triar un reporte
      description: |
        Requiere `report.triage` y `If-Match`. Si el reporte está en `received`, lo pasa a
        `triaged`. Con `decision=accept|reject|close` lo transita a `accepted`, `rejected` o
        `closed`; rechazar o cerrar exige `reason`. El actor no puede ser el reportante.
        Si se omite `decision` sobre un reporte ya triado, devuelve el estado actual.
      operationId: triageReport
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportTriageRequest'
      responses:
        '200':
          description: Reporte triado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /reports/{id}/convert:
    post:
      tags: [Reports]
      summary: Convertir un reporte aceptado en inspección
      description: |
        Requiere `report.triage` y `If-Match`. Crea una inspección `planned` y enlaza el
        reporte. El reporte debe estar en `accepted` y vinculado a un activo activo. La
        inspección requiere un revisor activo distinto del inspector. No admite
        `Idempotency-Key`; un segundo intento falla porque el reporte ya no está aceptado.
      operationId: convertReport
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportConvertRequest'
      responses:
        '201':
          description: Reporte convertido e inspección creada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportConvertResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /inspections:
    get:
      tags: [Inspections]
      summary: Listar inspecciones autorizadas
      description: |
        Requiere `inspection.read.assigned` o `inspection.read.audit`. Un inspector ve sus
        inspecciones asignadas y las que debe revisar; un admin con auditoría ve metadatos
        de todas. Solo se filtra por `state`; no hay paginación ni otros filtros en la
        implementación actual. Devuelve como máximo 100 inspecciones.
      operationId: listInspections
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InspectionState'
      responses:
        '200':
          description: Lista de inspecciones.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InspectionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Inspections]
      summary: Crear una inspección planificada
      description: |
        Requiere `inspection.create`. El activo debe estar activo. `inspectorId` es opcional
        y por defecto es el actor; `reviewerId` es obligatorio y debe ser otro inspector
        activo. No admite `Idempotency-Key`.
      operationId: createInspection
      x-falconsync-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionCreate'
      responses:
        '201':
          description: Inspección creada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Inspection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /inspectors:
    get:
      tags: [Inspections]
      summary: Listar inspectores activos
      description: |
        Requiere `inspection.create` o `report.triage`. Devuelve hasta 100 inspectores
        activos con `id` y `name`, ordenados por nombre.
      operationId: listInspectors
      x-falconsync-status: implemented
      responses:
        '200':
          description: Inspectores disponibles para asignación.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InspectorOption'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /inspections/{id}:
    get:
      tags: [Inspections]
      summary: Consultar una inspección
      description: |
        Requiere `inspection.read.assigned` como inspector o revisor asignado, o
        `inspection.read.audit` para metadatos de auditoría. El detalle autorizado incluye
        hallazgos, historial e intervenciones.
      operationId: getInspection
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InspectionId'
      responses:
        '200':
          description: Detalle con hallazgos, historial e intervenciones.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Inspection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /inspections/{id}/start:
    post:
      tags: [Inspections]
      summary: Iniciar una inspección asignada
      description: |
        Requiere `inspection.execute` y `If-Match`. Solo el inspector asignado puede iniciar
        una inspección en estado `planned`. No admite cuerpo.
      operationId: startInspection
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InspectionId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Inspección en `in_progress`.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Inspection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /inspections/{id}/resume:
    post:
      tags: [Inspections]
      summary: Reanudar una inspección devuelta
      description: |
        Requiere `inspection.execute` y `If-Match`. Solo el inspector asignado puede reanudar
        una inspección en estado `returned`, que vuelve a `in_progress`. No admite cuerpo.
      operationId: resumeInspection
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InspectionId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Inspección en `in_progress`.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Inspection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /inspections/{id}/findings:
    post:
      tags: [Inspections]
      summary: Añadir un hallazgo propuesto
      description: |
        Requiere `finding.propose` y `If-Match`. Solo el inspector asignado puede añadir
        hallazgos mientras la inspección está en `in_progress`. Devuelve la inspección
        completa, no el hallazgo aislado.
      operationId: addFinding
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InspectionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingCreate'
      responses:
        '201':
          description: Hallazgo añadido a la inspección.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Inspection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /inspections/{id}/findings/{findingId}:
    patch:
      tags: [Inspections]
      summary: Confirmar, descartar, reabrir o resolver un hallazgo
      operationId: updateFinding
      x-falconsync-status: planned
      parameters:
        - $ref: '#/components/parameters/InspectionId'
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingUpdateRequest'
      responses:
        '200':
          description: Inspección con el hallazgo actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Inspection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /inspections/{id}/submit:
    post:
      tags: [Inspections]
      summary: Enviar una inspección a revisión
      description: |
        Requiere `inspection.execute` y `If-Match`. Exige al menos un hallazgo o
        `noFindingsDeclared=true`.
      operationId: submitInspection
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InspectionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionSubmitRequest'
      responses:
        '200':
          description: Inspección en `submitted`.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Inspection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /inspections/{id}/review:
    post:
      tags: [Inspections]
      summary: Revisar una inspección
      description: |
        Requiere `inspection.review` y `If-Match`. El revisor asignado no puede ser el
        inspector. `decision=return` exige `notes` y devuelve la inspección a `returned`.
        `decision=approve` exige `result` y una severidad confirmada para cada hallazgo
        propuesto en `findings` (mapa `findingId` → severidad).
      operationId: reviewInspection
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InspectionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionReviewRequest'
      responses:
        '200':
          description: Inspección revisada o devuelta.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Inspection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /inspections/{id}/close:
    post:
      tags: [Inspections]
      summary: Cerrar una inspección revisada
      description: |
        Requiere `inspection.close` y `If-Match`. Solo el revisor puede cerrar una inspección
        en `reviewed`. Todo hallazgo con `requiresIntervention=true` debe tener una
        intervención `verified`; si hay hallazgos sin intervención sin resolver, se exige
        `justification`. Actualiza la proyección pública de conservación del POI vinculado.
      operationId: closeInspection
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InspectionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionCloseRequest'
      responses:
        '200':
          description: Inspección cerrada y proyección actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Inspection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /inspections/{id}/interventions:
    post:
      tags: [Interventions]
      summary: Proponer una intervención
      description: |
        Requiere `intervention.propose`. El actor debe ser el inspector o el revisor de la
        inspección, y la inspección debe estar `reviewed` o `closed`. Los `findingIds` deben
        pertenecer a la inspección. La evidencia se adjunta después con `POST /evidence` y
        `ownerType=Intervention`. Devuelve la intervención creada.
      operationId: createIntervention
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InspectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionCreate'
      responses:
        '201':
          description: Intervención propuesta.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Intervention'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /interventions/{id}:
    patch:
      tags: [Interventions]
      summary: Aprobar, rechazar, iniciar, completar o verificar una intervención
      description: |
        Requiere `If-Match` y alguna de `intervention.propose` o `intervention.verify` según
        corresponda. Acciones: `approve`, `reject`, `start`, `complete`, `verify`. La
        aprobación exige un actor distinto del proponente; el rechazo exige `reason`; solo
        el inspector asignado puede iniciar; solo el ejecutor puede completar y no puede
        verificarse a sí mismo. Completar y verificar exigen evidencia adjunta.
      operationId: transitionIntervention
      x-falconsync-status: implemented
      parameters:
        - $ref: '#/components/parameters/InterventionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionTransitionRequest'
      responses:
