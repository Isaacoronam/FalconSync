<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>FalconSync | Patrimonio Inteligente de Coro</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="FalconSync, plataforma turística de Coro y Falcón: descubre lugares, conversa con Chivito y guarda tus insignias."
    />
    <meta name="theme-color" content="#2b1a13" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="favicon.ico?v=20261125" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20261125" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261125" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fbf7ef;
      }

      .boot-skeleton {
        min-height: 100vh;
        color: #2b1a13;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        animation: boot-reveal 180ms ease 160ms both;
      }

      .boot-skeleton__sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .boot-skeleton__bar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1rem;
        width: min(1440px, calc(100% - 1.5rem));
        min-height: 4.6rem;
        margin: 0.75rem auto 0;
        padding: 0.35rem 1rem;
        border: 1px solid rgba(220, 199, 169, 0.92);
        border-radius: 22px;
        background: rgba(251, 247, 239, 0.9);
        box-shadow: 0 18px 48px rgba(43, 26, 19, 0.12);
      }

      .boot-skeleton__links,
      .boot-skeleton__actions {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }

      .boot-skeleton__actions {
        justify-content: flex-end;
      }

      .boot-skeleton__brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }

      .boot-skeleton__logo,
      .boot-skeleton__wordmark,
      .boot-skeleton__line,
      .boot-skeleton__card,
      .boot-skeleton__chip,
      .boot-skeleton__button,
      .boot-skeleton__map,
      .boot-skeleton__avatar {
        position: relative;
        display: block;
        overflow: hidden;
        border-radius: 999px;
        background: #ead9bf;
      }

      /* Shimmer compuesto: se desplaza con transform, no con
         background-position, para no repintar durante el arranque. */
      .boot-skeleton__logo::after,
      .boot-skeleton__wordmark::after,
      .boot-skeleton__line::after,
      .boot-skeleton__card::after,
      .boot-skeleton__chip::after,
      .boot-skeleton__button::after,
      .boot-skeleton__map::after,
      .boot-skeleton__avatar::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 15%,
          rgba(246, 236, 220, 0.88) 50%,
          transparent 85%
        );
        content: '';
        transform: translateX(-100%);
        animation: boot-shimmer 1.5s linear infinite;
      }

      .boot-skeleton__logo {
        width: 48px;
        height: 48px;
        border: 2px solid rgba(217, 154, 43, 0.5);
      }

      .boot-skeleton__wordmark {
        width: 9rem;
        height: 1.25rem;
        border-radius: 8px;
      }

      .boot-skeleton__line {
        width: 4.6rem;
        height: 0.7rem;
      }

      .boot-skeleton__line--long {
        width: 7rem;
      }

      .boot-skeleton__button {
        width: 8rem;
        height: 2.5rem;
        background: #d9b18f;
      }

      .boot-skeleton__burger {
        display: none;
        width: 2.6rem;
        height: 2.6rem;
        border: 1px solid #dcc7a9;
        border-radius: 50%;
        background: #f6ecdc;
      }

      .boot-skeleton__main {
        width: min(1440px, calc(100% - 2rem));
        margin: clamp(1rem, 3vw, 2.5rem) auto;
      }

      .boot-skeleton__eyebrow {
        width: 12rem;
        height: 0.65rem;
        margin-bottom: 1rem;
      }

      .boot-skeleton__title {
        width: min(38rem, 82%);
        height: clamp(2.2rem, 5vw, 3.6rem);
        margin-bottom: 0.8rem;
        border-radius: 12px;
      }

      .boot-skeleton__lead {
        width: min(34rem, 70%);
        height: 0.9rem;
        margin-bottom: 0.55rem;
      }

      .boot-skeleton__lead--short {
        width: min(24rem, 52%);
      }

      .boot-skeleton__grid {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(18rem, 0.7fr);
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .boot-skeleton__map {
        min-height: 30rem;
        border-radius: 18px;
        background: #ead9bf;
      }

      .boot-skeleton__panel {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        padding: 1rem;
        border: 1px solid #dcc7a9;
        border-radius: 16px;
        background: rgba(251, 247, 239, 0.9);
      }

      .boot-skeleton__chip {
        width: 5rem;
        height: 2rem;
      }

      .boot-skeleton__card {
        width: 100%;
        height: 4.2rem;
        border-radius: 12px;
      }

      @keyframes boot-shimmer {
        to {
          transform: translateX(100%);
        }
      }

      @keyframes boot-reveal {
        from {
          opacity: 0;
        }
      }

      @media (max-width: 960px) {
        .boot-skeleton__bar {
          grid-template-columns: 1fr auto;
          min-height: 3.9rem;
        }

        .boot-skeleton__links,
        .boot-skeleton__actions > :not(.boot-skeleton__burger) {
          display: none;
        }

        .boot-skeleton__burger {
          display: block;
        }

        .boot-skeleton__brand {
          grid-column: 1;
        }

        .boot-skeleton__actions {
          grid-column: 2;
        }

        .boot-skeleton__grid {
          grid-template-columns: 1fr;
        }

        .boot-skeleton__map {
          min-height: 18rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-skeleton,
        .boot-skeleton__logo,
        .boot-skeleton__wordmark,
        .boot-skeleton__line,
        .boot-skeleton__card,
        .boot-skeleton__chip,
        .boot-skeleton__button,
        .boot-skeleton__map,
        .boot-skeleton__avatar {
          animation: none;
          opacity: 1;
        }

        .boot-skeleton__logo::after,
        .boot-skeleton__wordmark::after,
        .boot-skeleton__line::after,
        .boot-skeleton__card::after,
        .boot-skeleton__chip::after,
        .boot-skeleton__button::after,
        .boot-skeleton__map::after,
        .boot-skeleton__avatar::after {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="boot-skeleton" role="status" aria-live="polite" aria-busy="true">
        <span class="boot-skeleton__sr">Cargando FalconSync…</span>
        <div class="boot-skeleton__bar" aria-hidden="true">
          <div class="boot-skeleton__links">
            <span class="boot-skeleton__line"></span>
            <span class="boot-skeleton__line"></span>
            <span class="boot-skeleton__line"></span>
          </div>
          <div class="boot-skeleton__brand">
            <span class="boot-skeleton__logo"></span>
            <span class="boot-skeleton__wordmark"></span>
          </div>
          <div class="boot-skeleton__actions">
            <span class="boot-skeleton__line boot-skeleton__line--long"></span>
            <span class="boot-skeleton__button"></span>
            <span class="boot-skeleton__burger"></span>
          </div>
        </div>
        <div class="boot-skeleton__main" aria-hidden="true">
          <span class="boot-skeleton__eyebrow boot-skeleton__line"></span>
          <span class="boot-skeleton__title boot-skeleton__line"></span>
          <span class="boot-skeleton__lead boot-skeleton__line"></span>
          <span class="boot-skeleton__lead boot-skeleton__lead--short boot-skeleton__line"></span>
          <div class="boot-skeleton__grid">
            <span class="boot-skeleton__map"></span>
            <div class="boot-skeleton__panel">
              <span class="boot-skeleton__line boot-skeleton__line--long"></span>
              <span class="boot-skeleton__chip"></span>
              <span class="boot-skeleton__chip"></span>
              <span class="boot-skeleton__card"></span>
              <span class="boot-skeleton__card"></span>
              <span class="boot-skeleton__card"></span>
            </div>
          </div>
        </div>
      </div>
      <noscript>
        <p style="padding: 2rem; font-family: system-ui, sans-serif">
          FalconSync necesita JavaScript para mostrar el mapa y la guía patrimonial.
        </p>
      </noscript>
    </app-root>
  </body>
</html>
